<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>连锁矿工 · Combo Miner</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #080b16; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center;
      font-family: 'Baloo 2', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #game { width: 100vw; height: 100vh; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      color: #8b97b8; background: radial-gradient(900px 600px at 50% 0%, #17203f, #080b16); z-index: 10; transition: opacity .4s; }
    #boot .logo { font-weight: 800; font-size: 30px;
      background: linear-gradient(90deg, #ffd24a, #ff7a59); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #boot .spin { width: 34px; height: 34px; border: 3px solid #2a3352; border-top-color: #ffd24a; border-radius: 50%; animation: sp 0.8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot"><div class="logo">连锁矿工</div><div class="spin"></div><div>加载中…</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
